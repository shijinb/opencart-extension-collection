name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: OpenCart ${{ matrix.opencart }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { opencart: 3.0.3.8, php: '7.4' }
          - { opencart: 3.0.3.9, php: '7.4' }
          - { opencart: 3.0.4.1, php: '8.1' }
          - { opencart: 3.0.5.1, php: '8.3' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Tests
        env:
          OC_VERSIONS: ${{ matrix.opencart }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
        run: bash tests/run.sh

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ocmod-packages
          path: dist/*.ocmod.zip
